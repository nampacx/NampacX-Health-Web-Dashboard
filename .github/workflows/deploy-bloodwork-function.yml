name: Deploy bloodwork tracking function

# `azd up` provisions and deploys the FULL infra/main.bicep template, which
# also defines the Withings broker's resources (see that file) -- so every
# run of this workflow re-applies both services' infrastructure, not just
# bloodwork's. That's why its required parameters below cover both.

on:
  push:
    branches: [main]
    paths: ['bloodwork/**', 'infra/**', 'azure.yaml']
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federated login, no publish profile involved
  contents: read

concurrency:
  # Shared with deploy-function.yml: both workflows run `azd up` against the
  # same resource group/template, so they must not run concurrently even
  # though each individual deployment is idempotent.
  group: azd-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to Azure (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision and deploy
        run: azd up --no-prompt
        env:
          # Must match the azd environment the live site's resources actually
          # live in (rg-hlth-dshbrd-dev, azd env "dev" -- see .azure/config.json
          # and the VITE_WITHINGS_BROKER_URL repo variable, which points at its
          # func-*-givd4mxbc6iqq hosts). This was "production" until 2026-08-19,
          # which silently provisioned and deployed to an unused rg-production
          # instead -- the real app never received deploys and crash-looped on
          # a months-old build.
          AZURE_ENV_NAME: dev
          # main.bicep is resourceGroup-scoped (targetScope = 'resourceGroup'),
          # so azd needs to be told which resource group to deploy into -- by
          # default it picks rg-<envName> ("rg-dev"), which does NOT exist.
          # The real one, rg-hlth-dshbrd-dev, is a one-off name set locally via
          # `azd env set AZURE_RESOURCE_GROUP` when this was first provisioned
          # (recorded only in the gitignored .azure/dev/.env, never in source
          # control), so CI never knew about it and provisioned rg-dev instead
          # on 2026-08-19 -- a second unwanted duplicate environment. See
          # https://learn.microsoft.com/azure/developer/azure-developer-cli/resource-group-scoped-deployments.
          AZURE_RESOURCE_GROUP: rg-hlth-dshbrd-dev
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          BLOODWORK_ALLOWED_ORIGINS: ${{ vars.BLOODWORK_ALLOWED_ORIGINS }}
          # Required by the broker's bicep parameters even though this
          # workflow doesn't touch broker/ -- see the note at the top of
          # this file.
          WITHINGS_CLIENT_ID: ${{ vars.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          ALLOWED_ORIGINS: ${{ vars.WITHINGS_ALLOWED_ORIGINS }}
          ALLOWED_REDIRECT_URIS: ${{ vars.WITHINGS_ALLOWED_REDIRECT_URIS }}
