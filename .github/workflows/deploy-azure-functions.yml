name: Deploy Azure Functions

# Single workflow for both Function Apps this repo provisions -- the Withings
# token broker (broker/) and the bloodwork tracking function (bloodwork/).
# They used to be two separate workflows (deploy-function.yml and
# deploy-bloodwork-function.yml), each running its own `azd up`. That was
# never actually independent: infra/main.bicep provisions BOTH services in
# one template, so every run of either workflow already re-applied both
# services' infrastructure and re-deployed both Function Apps regardless of
# which one's files changed. Two workflows just meant two `azd up` runs for
# any change touching infra/main.bicep or azure.yaml, serialized against each
# other through a shared concurrency group -- and, as of the bicep changes in
# PR #57 (bloodwork's CORS fix) and PR #59 (bloodwork's queue-encoding fix),
# a second `azd up` shortly after the first was exactly what produced a
# RoleAssignmentExists failure: a role assignment created live via `az role
# assignment create` while diagnosing production, colliding with the same
# assignment bicep tries to declare on the next run. One workflow, one `azd
# up`, removes the redundant second run entirely.

on:
  push:
    branches: [main]
    paths: ['broker/**', 'bloodwork/**', 'infra/**', 'azure.yaml']
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federated login, no publish profile involved
  contents: read

concurrency:
  # No longer shared across two workflow files -- only this one runs `azd up`
  # against the resource group now -- but still serialized against itself so
  # two pushes in quick succession don't race the same deployment.
  group: azd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to Azure (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision and deploy
        run: azd up --no-prompt
        env:
          AZURE_ENV_NAME: dev
          # main.bicep is resourceGroup-scoped (targetScope = 'resourceGroup'),
          # so azd needs to be told which resource group to deploy into -- by
          # default it picks rg-<envName> ("rg-dev"), which does NOT exist.
          # The real one, rg-hlth-dshbrd-dev, is a one-off name set locally via
          # `azd env set AZURE_RESOURCE_GROUP` when this was first provisioned
          # (recorded only in the gitignored .azure/dev/.env, never in source
          # control), so CI has to be told explicitly.
          AZURE_RESOURCE_GROUP: rg-hlth-dshbrd-dev
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          WITHINGS_CLIENT_ID: ${{ vars.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          ALLOWED_ORIGINS: ${{ vars.WITHINGS_ALLOWED_ORIGINS }}
          ALLOWED_REDIRECT_URIS: ${{ vars.WITHINGS_ALLOWED_REDIRECT_URIS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          BLOODWORK_ALLOWED_ORIGINS: ${{ vars.BLOODWORK_ALLOWED_ORIGINS }}
