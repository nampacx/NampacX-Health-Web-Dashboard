name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build
        env:
          # A project site is served from /<repo>/, so Vite needs that prefix.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # An OAuth client ID is public by design (it ships in the bundle either
          # way), so a repository variable is the right home for it — not a secret.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Withings is optional and independent of Google -- unlike the Google
          # var above, missing these must NOT fail the build. Also public by
          # design; the broker URL just points at the token-exchange Function.
          VITE_WITHINGS_CLIENT_ID: ${{ vars.VITE_WITHINGS_CLIENT_ID }}
          VITE_WITHINGS_BROKER_URL: ${{ vars.VITE_WITHINGS_BROKER_URL }}
          VITE_WITHINGS_REDIRECT_URI: ${{ vars.VITE_WITHINGS_REDIRECT_URI }}
          # Bloodwork is independent and optional too -- same posture as Withings
          # above. Uses the Google sign-in already required, so no separate client ID.
          VITE_BLOODWORK_API_URL: ${{ vars.VITE_BLOODWORK_API_URL }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_GOOGLE_CLIENT_ID is not set. Add it under Settings > Secrets and variables > Actions > Variables, otherwise the deployed site cannot sign anyone in."
            exit 1
          fi
          if [ -z "$VITE_WITHINGS_CLIENT_ID" ] || [ -z "$VITE_WITHINGS_BROKER_URL" ]; then
            echo "::warning::VITE_WITHINGS_CLIENT_ID or VITE_WITHINGS_BROKER_URL is not set. Withings stays optional -- the site will build and deploy Google-only, showing a 'connect' prompt for Withings instead of failing."
          fi
          if [ -z "$VITE_BLOODWORK_API_URL" ]; then
            echo "::warning::VITE_BLOODWORK_API_URL is not set. Bloodwork stays optional -- the tab will show a setup notice instead of failing the build."
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
