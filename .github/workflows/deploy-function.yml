name: Deploy Withings token broker

# `azd up` provisions and deploys the FULL infra/main.bicep template, which
# now also defines the bloodwork function's resources (see that file) -- so
# every run of this workflow re-applies both services' infrastructure, not
# just the broker's. That's why its required parameters below cover both.

on:
  push:
    branches: [main]
    paths: ['broker/**', 'infra/**', 'azure.yaml']
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federated login, no publish profile involved
  contents: read

concurrency:
  # Shared with deploy-bloodwork-function.yml: both workflows run `azd up`
  # against the same resource group/template, so they must not run
  # concurrently even though each individual deployment is idempotent.
  group: azd-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Log in to Azure (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision and deploy
        run: azd up --no-prompt
        env:
          # Must match the azd environment the live site's resources actually
          # live in (rg-hlth-dshbrd-dev, azd env "dev" -- see .azure/config.json
          # and the VITE_WITHINGS_BROKER_URL repo variable, which points at its
          # func-*-givd4mxbc6iqq hosts). This was "production" until 2026-08-19,
          # which silently provisioned and deployed to an unused rg-production
          # instead -- the real app never received deploys.
          AZURE_ENV_NAME: dev
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          WITHINGS_CLIENT_ID: ${{ vars.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          ALLOWED_ORIGINS: ${{ vars.WITHINGS_ALLOWED_ORIGINS }}
          ALLOWED_REDIRECT_URIS: ${{ vars.WITHINGS_ALLOWED_REDIRECT_URIS }}
          # Required by the bloodwork function's bicep parameters even
          # though this workflow doesn't touch bloodwork/ -- see the note
          # at the top of this file.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          BLOODWORK_ALLOWED_ORIGINS: ${{ vars.BLOODWORK_ALLOWED_ORIGINS }}
